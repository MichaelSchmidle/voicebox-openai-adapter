name: Backfill latest (0.1.1)

on:
  workflow_dispatch:

concurrency:
  group: publish-release-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  attestations: read

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/michaelschmidle/voicebox-openai-adapter
      DIGEST: sha256:12c47f5139f54fe5a974f447ba2212c044306dc43c2fab6c69600d4ab7eeffa7
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify existing release provenance and platforms
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "v0.1.1"
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/tags/v0.1.1
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' manifest.json
      - name: Alias existing image and verify digest
        run: |
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          actual=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')
          test "$actual" = "$DIGEST"
          # shellcheck disable=SC2016 # Markdown backticks are literal, not commands.
          printf 'latest -> `%s@%s`\n' "$IMAGE" "$actual" >> "$GITHUB_STEP_SUMMARY"
